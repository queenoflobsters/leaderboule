stages:
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_TLS_CERTDIR: "/certs"

build-and-push:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --name ci-builder
  script:
    - |
      docker buildx build \
        --platform linux/amd64 \
        --push \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE:latest" \
        .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p ~/leaderboule"
    - scp docker-compose.yml "$SERVER_USER@$SERVER_HOST:~/leaderboule/docker-compose.yml"
    - |
      ssh "$SERVER_USER@$SERVER_HOST" "
        set -e
        cd ~/leaderboule

        # Write .env file
        cat << 'EOF' > .env
      DATABASE_USER=${DATABASE_USER}
      DATABASE_PASS=${DATABASE_PASS}
      HELLOASSO_CLIENT_ID=${HELLOASSO_CLIENT_ID}
      HELLOASSO_CLIENT_SECRET=${HELLOASSO_CLIENT_SECRET}
      EOF

        # Login to GitLab registry on the server
        echo '${CI_REGISTRY_PASSWORD}' | docker login -u '${CI_REGISTRY_USER}' --password-stdin '${CI_REGISTRY}'

        # Pull and restart the app service
        docker compose pull app
        docker compose up -d app
        docker image prune -f
      "
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
