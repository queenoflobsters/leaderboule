services:
  # -------------------------------------------------------------
  # PostgreSQL Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leaderboule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaderboule}
      POSTGRES_DB: ${POSTGRES_DB:-leaderboule}
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # For me to access the db anytime
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------
  # Leaderboule - Dioxus Application
  # -------------------------------------------------------------
  app:
    build: .
    image: registry.gitlab.com/sia-insa-lyon/va/petanque-insa-club:latest
    init: true
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-leaderboule}:${POSTGRES_PASSWORD:-leaderboule}@postgres:5432/${POSTGRES_DB:-leaderboule}
      - HELLOASSO_CLIENT_ID=${HELLOASSO_CLIENT_ID}
      - HELLOASSO_CLIENT_SECRET=${HELLOASSO_CLIENT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
