services:
  # Container 1: Surreal database
  surrealdb:
    image: surrealdb/surrealdb:v3.0.0
    user: root
    command: start --bind 0.0.0.0:8000 rocksdb:/data/boules.db
    ports:
      - "8000:8000" # For me to access the db anytime
    volumes:
      - db_data:/data:z
    restart: unless-stopped
    environment:
      - SURREAL_USER=${DATABASE_USER}
      - SURREAL_PASS=${DATABASE_PASS}
    healthcheck:
      test: ["CMD", "/surreal", "is-ready"]
      start_period: 2s
      interval: 3s
      timeout: 3s
      retries: 5
      

  # Container 2: Dioxus App
  app:
    build: .
    image: registry.gitlab.com/sia-insa-lyon/va/petanque-insa-club:latest
    init: true 
    environment:
      - DATABASE_URL=surrealdb:8000
      - DATABASE_USER=${DATABASE_USER:~root}
      - DATABASE_PASS=${DATABASE_PASS:~root}
      - HELLOASSO_CLIENT_ID=${HELLOASSO_CLIENT_ID}
      - HELLOASSO_CLIENT_SECRET=${HELLOASSO_CLIENT_SECRET}
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      # surrealdb
      surrealdb:
        condition: service_healthy

volumes:
  db_data:
