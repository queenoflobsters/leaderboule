services:
  # -------------------------------------------------------------
  # Leaderboule - Dioxus Application
  # -------------------------------------------------------------
  leaderboule-app:
    image: registry.gitlab.com/sia-insa-lyon/va/petanque-insa-club:latest
    init: true
    pull_policy: always
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.leaderboule-app.rule=Host(`${HOST}`)"
      # # Switch cert resolver when local
      # - "traefik.http.routers.leaderboule-app.tls=true"
      - "traefik.http.routers.leaderboule-app.tls.certresolver=httpchallenge"
      - "traefik.http.services.leaderboule-app.loadbalancer.server.port=8080"
    environment:
      # Database connection
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@leaderboule-db:5432/${POSTGRES_DB}
      # Helloasso API Interaction
      HELLOASSO_CLIENT_ID: ${HELLOASSO_CLIENT_ID}
      HELLOASSO_CLIENT_SECRET: ${HELLOASSO_CLIENT_SECRET}
      # App runtime settings
      PORT: 8080
      IP: 0.0.0.0 # Exposes
      TZ: Europe/Paris
    networks:
      - traefik-network
      - leaderboule-network
    depends_on:
      leaderboule-db:
        condition: service_healthy

  # -------------------------------------------------------------
  # PostgreSQL Database
  # -------------------------------------------------------------
  leaderboule-db:
    image: postgres:17-alpine
    restart: always
    pull_policy: if_not_present
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Paris
    volumes:
      - leaderboule-data:/var/lib/postgresql/data:z
    networks:
      - leaderboule-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 10

# -------------------------------------------------------------
# Networks
# -------------------------------------------------------------
networks:
  # External network
  traefik-network:
    name: traefik-network
    external: true

  # Bridge betwen App and Database
  leaderboule-network:
    name: leaderboule-network
    external: false

# -------------------------------------------------------------
# Persistent Data Volumes
# -------------------------------------------------------------
volumes:
  leaderboule-data:
    name: leaderboule-data
