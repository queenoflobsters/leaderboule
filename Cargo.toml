[package]
name = "leaderboule"
version = "0.1.0"
authors = ["gabribribribri <fuelanemo149@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "=0.7.10", features = ["router", "fullstack"] }
reqwest = { version = "0.13.4", features  = ["json"] }
serde = { version = "1.0.229", features = ["derive"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "MediaQueryList"]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
surrealdb = {version = "3.2.4", features = ["protocol-ws"]}
tokio = {version = "1.53.1", features = ["full"]}
uuid = { version = "1.10", features = ["v4"]}


[features]
default = ["web", "server"]
web = ["dioxus/web"]
server = ["dioxus/server"]

[profile.release]
opt-level = "z" 
lto = true       
codegen-units = 1
panic = "abort"  
strip = true     

# surreal start --user root --pass root --bind 127.0.0.1:8000 rocksdb:boules.db
