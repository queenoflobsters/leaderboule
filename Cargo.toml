[package]
name = "leaderboule"
version = "0.1.0"
authors = ["gabribribribri <fuelanemo149@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "=0.7.10", features = ["router", "fullstack"] }
reqwest = { version = "0.13.4", features  = ["json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "MediaQueryList"]}
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sea-orm = { version = "2.0.4", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-uuid",
] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = {version = "1.53.1", features = ["full"]}
dotenvy = "0.15"
argon2 = "0.5"


[features]
default = ["web", "server"]
web = ["dioxus/web"]
server = ["dioxus/server"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# `dx bundle` runs wasm-bindgen after rustc: `strip = true` removes the
# metadata wasm-bindgen needs on recent LLVM versions and breaks the web build.
strip = "debuginfo"


